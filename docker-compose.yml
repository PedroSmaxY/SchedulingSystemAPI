version: "3.8"

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: scheduling-db
    environment:
      POSTGRES_DB: scheduling_system_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ASP.NET Core API
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: scheduling-api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - DB_SERVER=postgres
      - DB_NAME=scheduling_system_db
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - JWT_KEY=my-super-secret-key-with-at-least-32-characters
      - JWT_ISSUER=SchedulingAPI
      - JWT_AUDIENCE=SchedulingAPIClients
    ports:
      - "8080:8080"
    restart: unless-stopped

volumes:
  postgres-data:
